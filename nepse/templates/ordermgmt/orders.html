{% extends "base.html" %}

{% block content %}
<div class="dashboard-header animate-fade-in">
    <div class="header-main">
        <h1 class="page-title">Order Book</h1>
        <p class="page-subtitle">Open, pending, and expired orders</p>
    </div>
    <div class="header-actions">
        <a href="{{ url_for('order_index') }}" class="btn btn-secondary">
            <i class="fas fa-plus"></i> New Order
        </a>
    </div>
</div>

<div class="card animate-slide-up" style="margin-top: 24px;">
    <div class="card-header">
        <h2 class="card-title">Open Orders</h2>
        <span id="orderCount" style="font-size: 0.8rem; color: var(--tms-text-light);"></span>
    </div>
    <div class="table-container">
        <table class="tms-table" id="ordersTable">
            <thead>
                <tr>
                    <th>Created</th>
                    <th>Symbol</th>
                    <th>Side</th>
                    <th>Type</th>
                    <th class="text-right">Qty</th>
                    <th class="text-right">Price (NPR)</th>
                    <th>Validity</th>
                    <th>Expires</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody id="ordersList">
            </tbody>
        </table>
    </div>
</div>

<style>
.badge {
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    display: inline-block;
}
.badge-buy {
    background: rgba(239, 68, 68, 0.15);
    color: var(--negative);
}
.badge-sell {
    background: rgba(34, 197, 94, 0.15);
    color: var(--positive);
}
.badge-market {
    background: rgba(59, 130, 246, 0.15);
    color: var(--tms-blue);
}
.badge-limit {
    background: rgba(245, 158, 11, 0.15);
    color: #f59e0b;
}
.badge-stop {
    background: rgba(139, 92, 246, 0.15);
    color: #8b5cf6;
}
.badge-open {
    background: rgba(245, 158, 11, 0.15);
    color: #f59e0b;
}
</style>

<script>
function loadOrders() {
    fetch('/api/orders')
        .then(res => res.json())
        .then(data => {
            const tbody = document.getElementById('ordersList');
            const count = document.getElementById('orderCount');
            const orders = data.orders || [];

            count.innerText = orders.length + ' open order' + (orders.length !== 1 ? 's' : '');

            if (orders.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="9" class="text-center" style="padding: 40px; color: var(--tms-text-light);">
                            <i class="fas fa-inbox" style="font-size: 2rem; margin-bottom: 15px; opacity: 0.3; display: block;"></i>
                            No open orders
                        </td>
                    </tr>`;
                return;
            }

            tbody.innerHTML = orders.map(order => `
                <tr>
                    <td style="font-size: 0.8rem; color: var(--tms-text-light); white-space: nowrap;">
                        ${order.created_at || '—'}
                    </td>
                    <td><strong>${order.symbol}</strong></td>
                    <td>
                        <span class="badge badge-${order.side.toLowerCase()}">${order.side}</span>
                    </td>
                    <td>
                        <span class="badge badge-${order.order_type === 'MARKET' ? 'market' : order.order_type === 'LIMIT' ? 'limit' : 'stop'}">
                            ${order.order_type}
                        </span>
                    </td>
                    <td class="text-right">${order.qty.toLocaleString()}</td>
                    <td class="text-right" style="font-weight: 700;">${order.price.toLocaleString('en-US', {minimumFractionDigits: 2})}</td>
                    <td>
                        <span style="font-size: 0.8rem; color: var(--tms-text-light);">${order.validity}</span>
                    </td>
                    <td style="font-size: 0.8rem; color: var(--tms-text-light);">${order.expires_at || 'Today EOD'}</td>
                    <td class="text-center">
                        <button onclick="cancelOrder(${order.id})"
                            style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 14px; border-radius: 4px; color: var(--negative); cursor: pointer; font-weight: 600; font-size: 0.8rem;">
                            Cancel
                        </button>
                    </td>
                </tr>`).join('');
        })
        .catch(err => {
            console.error('Failed to load orders:', err);
        });
}

function cancelOrder(orderId) {
    if (!confirm('Are you sure you want to cancel this order?')) return;

    fetch(`/api/orders/${orderId}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                loadOrders();
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(err => {
            alert('Network error: ' + err.message);
        });
}

loadOrders();
</script>
{% endblock %}
