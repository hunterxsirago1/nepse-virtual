{% extends 'base.html' %}

{% block content %}
<div class="dashboard-header" style="margin-bottom: 20px;">
    <h1 style="font-size: 1.5rem; margin: 0; color: var(--tms-blue-dark);">Order Management - Trading Terminal</h1>
</div>

<div class="card">
    <div class="card-header">
        <h3><i class="fas fa-shopping-cart"></i> Buy/Sell Order Entry</h3>
    </div>
    <div class="card-body">
        <form id="orderForm" style="padding: 20px;">
            <div class="trade-form-grid" style="grid-template-columns: repeat(2, 1fr);">
                <!-- Left Column -->
                <div class="form-group">
                    <label>Order Type</label>
                    <div class="order-toggle">
                        <input type="radio" name="trade_type" id="buyCheck" value="BUY" checked>
                        <label for="buyCheck" class="buy-label">BUY</label>
                        <input type="radio" name="trade_type" id="sellCheck" value="SELL">
                        <label for="sellCheck" class="sell-label">SELL</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Symbol</label>
                    <input list="symbols" name="symbol" id="symbolInput" placeholder="Symbol (e.g. ADL)" onchange="updatePriceInfo()">
                    <datalist id="symbols">
                        <!-- Filled by JS -->
                    </datalist>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="quantity" placeholder="Quantity (e.g. 10)" step="10" min="10">
                </div>

                <div class="form-group">
                    <label>Price Type</label>
                    <select id="priceType" style="padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 4px;">
                        <option value="LMT">Limit (LMT)</option>
                        <option value="MKT">Market (MKT)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Price</label>
                    <input type="number" id="price" placeholder="Price" step="0.10">
                </div>
                
                <div class="form-group">
                    <label>Total Amount (Inc. Commissions)</label>
                    <input type="text" id="totalAmount" disabled style="background-color: #f1f1f1; font-weight: 700;">
                </div>
            </div>

            <!-- Price Info Bar -->
            <div id="priceInfo" style="margin: 0 20px 20px; padding: 10px; background: #e3f2fd; border-radius: 4px; display: none; font-size: 0.85rem;">
                <span id="lowInfo">Low: 0</span> | <span id="highInfo">High: 0</span> | <span id="ltpInfo">LTP: 0</span> | <span id="pcloseInfo">Prev. Close: 0</span>
            </div>

            <div style="padding: 0 20px 20px; text-align: right;">
                <button type="button" class="badge-buy" style="padding: 10px 30px; border: none; font-weight: 700; cursor: pointer; background: var(--tms-blue-dark); color: white;" id="submitOrderBtn">Execute Order</button>
                <button type="reset" class="badge-sell" style="padding: 10px 20px; border: none; font-weight: 700; cursor: pointer;">Clear</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Fetch symbols for datalist and market info
    let marketData = {};

    fetch('/ordermgmt/data3')
        .then(response => response.json())
        .then(data => {
            const dl = document.getElementById('symbols');
            for(let i=0; i < data.symbols.length; i++){
                let opt = document.createElement('option');
                opt.value = data.symbols[i];
                dl.appendChild(opt);
                marketData[data.symbols[i]] = {
                    ltp: data.ltps[i],
                    low: data.lows[i],
                    high: data.highs[i],
                    pclose: data.pcloses[i]
                };
            }
        });

    function updatePriceInfo() {
        const symbol = document.getElementById('symbolInput').value;
        const info = marketData[symbol];
        if(info) {
            document.getElementById('priceInfo').style.display = 'block';
            document.getElementById('lowInfo').innerText = 'Low: ' + info.low;
            document.getElementById('highInfo').innerText = 'High: ' + info.high;
            document.getElementById('ltpInfo').innerText = 'LTP: ' + info.ltp;
            document.getElementById('pcloseInfo').innerText = 'P. Close: ' + info.pclose;
            document.getElementById('price').value = info.ltp;
            calculateTotal();
        }
    }

    function calculateTotal() {
        const price = parseFloat(document.getElementById('price').value) || 0;
        const qty = parseInt(document.getElementById('quantity').value) || 0;
        const total = price * qty;
        // Mock commission
        const commission = total * 0.004; 
        document.getElementById('totalAmount').value = (total + commission).toFixed(2);
    }

    document.getElementById('price').addEventListener('input', calculateTotal);
    document.getElementById('quantity').addEventListener('input', calculateTotal);

    document.getElementById('submitOrderBtn').addEventListener('click', function() {
        const symbol = document.getElementById('symbolInput').value;
        const price = document.getElementById('price').value;
        const quantity = document.getElementById('quantity').value;
        const type = document.querySelector('input[name="trade_type"]:checked').value;

        if(!symbol || !price || !quantity) {
            alert('Please fill all fields');
            return;
        }

        fetch('/trade/execute', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({symbol, price, quantity, type})
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'success') {
                alert('Order Executed Successfully!');
                location.href = '/';
            } else {
                alert('Error: ' + data.message);
            }
        });
    });
</script>
{% endblock %}
