<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NEPSE Simulator{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>NEPSE SIM</span>
            </div>
            <nav>
                <a href="{{ url_for('index') }}" class="{% if request.path == '/' %}active{% endif %}">
                    <i class="fas fa-home"></i> Dashboard
                </a>
                <a href="{{ url_for('market_index') }}" class="{% if request.path.startswith('/marketmgmt') %}active{% endif %}">
                    <i class="fas fa-exchange-alt"></i> Market
                </a>
                <a href="{{ url_for('order_index') }}" class="{% if request.path.startswith('/ordermgmt') %}active{% endif %}">
                    <i class="fas fa-shopping-cart"></i> Trade
                </a>
            </nav>
            <div class="sidebar-footer">
                <p>&copy; 2024 NEPSE Sim</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="search-container">
                    <i class="fas fa-search"></i>
                    <input type="text" id="global-search" placeholder="Search Symbol...">
                </div>
                <div class="user-profile">
                    <span class="wallet-balance">Balance: रु. {{ "{:,.2f}".format(user.balance) }}</span>
                    <div class="avatar"><i class="fas fa-user"></i></div>
                </div>
            </header>
            
            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
